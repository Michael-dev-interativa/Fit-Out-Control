<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitout APP</title>

  <script>
    (function () {
      const BACKEND_HOST = 'https://fit-out-backend.onrender.com';
      const FRONTEND_HOST_REGEX = /fit-out-control-frontend1\.onrender\.com/;
      const API_FILES_SEGMENT = 'api/files/';

      function fixUrl(url) {
        if (!url || typeof url !== 'string') return url;
        if (FRONTEND_HOST_REGEX.test(url)) {
          return url.replace(FRONTEND_HOST_REGEX, 'fit-out-backend.onrender.com');
        }
        const idx = url.indexOf(API_FILES_SEGMENT);
        if (idx !== -1) {
          const path = url.slice(idx > 0 && url[idx - 1] === '/' ? idx - 1 : idx);
          return BACKEND_HOST + (path.startsWith('/') ? path : '/' + path);
        }
        return url;
      }

      function fixImage(img) {
        try {
          const src = img.getAttribute('src');
          const fixedSrc = fixUrl(src || img.src);
          if (src && fixedSrc && fixedSrc !== src) img.setAttribute('src', fixedSrc);

          const srcset = img.getAttribute('srcset');
          if (srcset) {
            const fixedSrcset = srcset.split(',').map(function (part) {
              const bits = part.trim().split(' ');
              bits[0] = fixUrl(bits[0]);
              return bits.join(' ');
            }).join(', ');
            if (fixedSrcset !== srcset) img.setAttribute('srcset', fixedSrcset);
          }
        } catch (e) {
          // no-op
        }
      }

      function fixAll(scope) {
        const root = scope && scope.querySelectorAll ? scope : document;
        root.querySelectorAll('img').forEach(fixImage);
      }

      document.addEventListener('DOMContentLoaded', function () {
        fixAll(document);
        const observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              if (!node || node.nodeType !== 1) return;
              if (node.tagName === 'IMG') fixImage(node);
              fixAll(node);
            });
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script>
    (function () {
      function showFallback() {
        var root = document.getElementById('root');
        if (!root) return;
        if (root.children && root.children.length > 0) return;

        var box = document.createElement('div');
        box.style.cssText = [
          'position:fixed',
          'inset:0',
          'display:flex',
          'align-items:center',
          'justify-content:center',
          'padding:24px',
          'background:#f8fafc',
          'color:#0f172a',
          'font-family:Arial, sans-serif',
          'z-index:999999'
        ].join(';');

        box.innerHTML = '<div style="max-width:640px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;box-shadow:0 10px 25px rgba(15,23,42,.08)">' +
          '<h2 style="margin:0 0 8px 0;font-size:20px">Não foi possível carregar o front-end</h2>' +
          '<p style="margin:0 0 12px 0;line-height:1.4">A página ficou em branco porque o app não montou corretamente.</p>' +
          '<ol style="margin:0 0 12px 18px;padding:0;line-height:1.5">' +
          '<li>Faça <strong>Ctrl + F5</strong> para limpar cache da página.</li>' +
          '<li>Abra em aba anônima e desative extensões de tradução.</li>' +
          '<li>Confira se o deploy mais recente está ativo.</li>' +
          '</ol>' +
          '<p style="margin:0;font-size:12px;color:#475569">URL: ' + window.location.href + '</p>' +
          '</div>';

        document.body.appendChild(box);
      }

      window.addEventListener('load', function () {
        setTimeout(showFallback, 6000);
      });
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
