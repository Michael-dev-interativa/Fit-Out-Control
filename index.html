<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitout APP</title>

  <!-- HOTFIX: Correção automática de URLs de imagens (melhorado) -->
  <script>
    (function () {
      console.log('🔧 [HOTFIX] Interceptor de URLs de imagens ativado (melhorado)');

      const BACKEND_HOST = 'https://fit-out-backend.onrender.com';
      const FRONTEND_HOST_REGEX = /fit-out-control-frontend1\.onrender\.com/;
      const API_FILES_SEGMENT = 'api/files/';

      function buildFixedUrlFromMatch(url) {
        if (!url) return url;
        // If contains frontend host, replace it
        if (FRONTEND_HOST_REGEX.test(url)) {
          const fixed = url.replace(FRONTEND_HOST_REGEX, 'fit-out-backend.onrender.com');
          console.log('🔧 [HOTFIX] URL host substituted:', url, '→', fixed);
          return fixed;
        }

        // If contains api/files/ anywhere (with or without leading slash), build absolute backend URL
        const idx = url.indexOf(API_FILES_SEGMENT);
        if (idx !== -1) {
          const path = url.slice(idx - 1 >= 0 && url[idx - 1] === '/' ? idx - 1 : idx);
          const normalized = path.startsWith('/') ? path : '/' + path;
          const fixed = BACKEND_HOST + normalized;
          console.log('🔧 [HOTFIX] api/files path converted:', url, '→', fixed);
          return fixed;
        }

        return url;
      }

      function fixSrcValue(value) {
        if (!value) return value;
        // If srcset, fix each URL inside
        if (value.includes(',')) {
          try {
            const parts = value.split(',').map(part => {
              const sub = part.trim().split(' ');
              sub[0] = buildFixedUrlFromMatch(sub[0]);
              return sub.join(' ');
            });
            return parts.join(', ');
          } catch (e) {
            return buildFixedUrlFromMatch(value);
          }
        }
        return buildFixedUrlFromMatch(value);
      }

      // Override HTMLImageElement.src setter to intercept direct assignments
      try {
        const imgProto = HTMLImageElement.prototype;
        const desc = Object.getOwnPropertyDescriptor(imgProto, 'src');
        if (desc && desc.set) {
          const originalSetter = desc.set;
          Object.defineProperty(imgProto, 'src', {
            set: function (val) {
              const fixed = fixSrcValue(val);
              return originalSetter.call(this, fixed);
            },
            get: desc.get,
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        // ignore if we cannot override
      }

      // Intercept setAttribute for src, srcset and style background-image
      const originalSetAttribute = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function (name, value) {
        if (!value) return originalSetAttribute.call(this, name, value);
        const n = String(name).toLowerCase();
        if ((this.tagName === 'IMG' && (n === 'src' || n === 'srcset')) || (n === 'style' && value && value.includes('background'))) {
          if (n === 'src' || n === 'srcset') value = fixSrcValue(value);
          if (n === 'style') {
            // try to replace url(...) inside style
            value = value.replace(/url\(([^)]+)\)/g, function (_, p1) {
              const cleaned = p1.replace(/['\"]+/g, '').trim();
              const fixed = buildFixedUrlFromMatch(cleaned);
              return 'url("' + fixed + '")';
            });
          }
        }
        return originalSetAttribute.call(this, name, value);
      };

      // MutationObserver to fix existing and newly added imgs and background images
      const observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (!node) return;
            if (node.nodeType !== 1) return;
            // Images
            if (node.tagName === 'IMG') {
              try {
                const fixed = fixSrcValue(node.getAttribute('src') || node.src);
                if (fixed && fixed !== (node.src || node.getAttribute('src'))) node.src = fixed;
                const srcset = node.getAttribute('srcset');
                if (srcset) {
                  const fixedSrcset = fixSrcValue(srcset);
                  if (fixedSrcset !== srcset) node.setAttribute('srcset', fixedSrcset);
                }
              } catch (e) { }
            }
            // Any element with background-image
            try {
              if (node.style && node.style.backgroundImage) {
                const bg = node.style.backgroundImage;
                const m = bg.match(/url\(([^)]+)\)/);
                if (m && m[1]) {
                  const cleaned = m[1].replace(/['\"]+/g, '').trim();
                  const fixed = buildFixedUrlFromMatch(cleaned);
                  if (fixed && !bg.includes(fixed)) node.style.backgroundImage = 'url("' + fixed + '")';
                }
              }
            } catch (e) { }

            // Fix nested imgs
            try {
              node.querySelectorAll && node.querySelectorAll('img').forEach(function (img) {
                const fixed = fixSrcValue(img.getAttribute('src') || img.src);
                if (fixed && fixed !== (img.src || img.getAttribute('src'))) img.src = fixed;
                const srcset = img.getAttribute('srcset');
                if (srcset) {
                  const fixedSrcset = fixSrcValue(srcset);
                  if (fixedSrcset !== srcset) img.setAttribute('srcset', fixedSrcset);
                }
              });
            } catch (e) { }
          });
          // Also fix attribute changes
          if (mutation.type === 'attributes' && mutation.target) {
            const tgt = mutation.target;
            if (tgt.tagName === 'IMG') {
              const fixed = fixSrcValue(tgt.getAttribute('src') || tgt.src);
              if (fixed && fixed !== (tgt.src || tgt.getAttribute('src'))) tgt.src = fixed;
            }
          }
        });
      });

      function startObserver() {
        observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'srcset', 'style'] });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startObserver);
      } else {
        startObserver();
      }

      // Fix existing images on load
      try {
        document.querySelectorAll('img').forEach(function (img) {
          const fixed = fixSrcValue(img.getAttribute('src') || img.src);
          if (fixed && fixed !== (img.src || img.getAttribute('src'))) img.src = fixed;
          const srcset = img.getAttribute('srcset');
          if (srcset) {
            const fixedSrcset = fixSrcValue(srcset);
            if (fixedSrcset !== srcset) img.setAttribute('srcset', fixedSrcset);
          }
        });
      } catch (e) { }

    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
