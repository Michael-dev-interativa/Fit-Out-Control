services:
  # Frontend - Web Service com Express
  - type: web
    name: fitout-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node serve-frontend.js
    envVars:
      - key: VITE_API_URL
        value: https://fitout-backend.onrender.com
      - key: NODE_ENV
        value: production
