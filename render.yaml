services:
  # Frontend - Static Site
  - type: web
    name: fitout-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://fitout-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
