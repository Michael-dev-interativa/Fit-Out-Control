services:
  # Backend - Web Service
  - type: web
    name: fitout-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitout-db
          property: connectionString
    healthCheckPath: /api/health

  # Frontend - Static Site com rewrite para SPA
  - type: static
    name: front-fitout
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://backend-fitout.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
